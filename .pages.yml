        description: 'Déjalo en «Equipo». «Bot» es sólo para las noticias que escribe el robot, y esas necesitan la fuente original.'
        options:
          values:
            - name: equipo
              label: Equipo High Doctor Foundation
            - name: bot
              label: Bot de noticias

      - name: draft
        label: Borrador
        type: boolean
