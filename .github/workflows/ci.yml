# QA en cada PR (prompt 09): comprobación de tipos, tests, build y crawler
# de enlaces internos. La publicación sigue en deploy.yml (sólo push a main).
name: QA de PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo: `noticias comprobar` compara con la rama base.
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bot/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar dependencias del bot (astro check y vitest compilan bot/)
        run: npm ci --prefix bot --no-audit --no-fund

      - name: Metodología de noticias (docs/METODOLOGIA-NOTICIAS.md)
        run: npm run noticias -- comprobar --sin-red

      - name: Astro check (tipos)
        run: npm run check

      - name: Tests unitarios (vitest, incl. bot/)
        run: npm test

      - name: Build
        run: npm run build

      - name: Crawler de enlaces internos sobre dist/
        run: npm run qa:links
